# /etc/nginx/sites-available/zimfete-assets
# Serves the staff web app and the asset-financing API on ONE origin (needed for the session cookie).
# Get a certificate first, e.g.: sudo certbot --nginx -d assets.zimfete.co.zw

server {
    listen 443 ssl http2;
    server_name assets.zimfete.co.zw;

    ssl_certificate     /etc/letsencrypt/live/assets.zimfete.co.zw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assets.zimfete.co.zw/privkey.pem;

    # Built files from staff-web/dist
    root /var/www/zimfete-assets;
    index index.html;

    # Security headers: see security-headers.conf (copy it to /etc/nginx/snippets/).
    include snippets/zimfete-security-headers.conf;

    # API (Spring Boot on the same VM). Photos are uploaded through here.
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        include snippets/zimfete-security-headers.conf;
    }

    # Hashed build files never change: cache them for a year.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/zimfete-security-headers.conf;
    }

    # Single-page app: unknown paths load index.html, which must never be cached.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include snippets/zimfete-security-headers.conf;
    }
}

server {
    listen 80;
    server_name assets.zimfete.co.zw;
    return 301 https://$host$request_uri;
}
