<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Staff updates | ZimFete</title><link rel="stylesheet" href="/styles.css"></head><body><main class="section"><div class="wrap admin-wrap"><a href="/#updates">Back to website</a><h1>News &amp; programs</h1><p>Add announcements, update programs or archive old notices. Published changes appear on the website.</p><form id="login"><label>Staff password<input id="password" type="password" required autocomplete="current-password"></label><button class="btn btn-navy">Sign in</button></form><p id="message" role="status"></p><section id="editor" hidden><button id="logout" type="button" class="btn">Sign out</button><div class="admin-layout"><div><h2>Announcements</h2><button id="new" type="button" class="btn btn-navy">New announcement</button><div id="entries"></div></div><form id="announcement"><input name="id" type="hidden"><label>Title<input name="title" required maxlength="160"></label><label>Category<select name="type"><option value="news">News / meeting</option><option value="program">Program</option></select></label><label>Date<input name="date" type="date" required></label><label>Location<input name="location" maxlength="200"></label><label>Short introduction<textarea name="summary" required maxlength="600" rows="3"></textarea></label><label>Full details<textarea name="body" required maxlength="12000" rows="12"></textarea></label><p>Separate paragraphs with a blank line. Include eligibility, costs, deadlines and contact details where relevant.</p><label>Poster (PNG, JPEG or WebP, up to 250 KB)<input id="poster" type="file" accept="image/png,image/jpeg,image/webp"></label><img id="poster-preview" class="update-poster" alt="Poster preview" hidden><button id="remove-poster" type="button">Remove poster</button><label>Visibility<select name="status"><option value="draft">Draft (staff only)</option><option value="published">Published (public)</option><option value="archived">Archived (staff only)</option></select></label><button id="save" class="btn btn-orange">Save announcement</button></form></div></section></div></main><script src="/admin/admin.js"></script></body></html>
